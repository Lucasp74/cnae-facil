name: Atualizar doações

on:
  workflow_dispatch:
  # Ligar depois do teste de R$ 1 (tirar o # das duas linhas abaixo): roda a cada 6 horas.
  # schedule:
  #   - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency: doacoes

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/doacao.mjs --teste
      - run: node scripts/doacao.mjs --mercadopago
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
      - name: Publicar se o valor mudou
        run: |
          if git diff --quiet; then echo "Sem mudança no total."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualiza o total de doações"
          git push
